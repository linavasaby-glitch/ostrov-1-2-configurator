<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Конфигуратор игровой среды для детей 9–24 месяцев">
  <title>Остров первых открытий | Конфигуратор среды 9–24 месяцев</title>
  <style>:root {
  --background: #edf0f1;
  --surface: #f8f9f8;
  --surface-strong: #ffffff;
  --surface-muted: #e4e9e9;
  --text: #18201f;
  --text-muted: #5d6967;
  --line: #cbd3d2;
  --line-strong: #aeb9b7;
  --accent: #c95039;
  --accent-soft: #f4ddd7;
  --accent-ink: #7d2c1d;
  --success: #285d4c;
  --success-soft: #dce9e4;
  --floor-code: #c95039;
  --wall-code: #527b98;
  --mobile-code: #5f8069;
  --shadow: 0 1.5rem 4rem rgb(44 57 55 / 0.11);
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
}

@media (prefers-color-scheme: dark) {
  :root {
    --background: #151a1a;
    --surface: #1d2423;
    --surface-strong: #252d2c;
    --surface-muted: #2d3735;
    --text: #edf2f1;
    --text-muted: #a9b5b2;
    --line: #36413f;
    --line-strong: #52605d;
    --accent: #e2745d;
    --accent-soft: #462a25;
    --accent-ink: #ffc2b4;
    --success: #9ad0bc;
    --success-soft: #253d36;
    --floor-code: #e2745d;
    --wall-code: #83afd0;
    --mobile-code: #8db798;
    --shadow: 0 1.5rem 4rem rgb(0 0 0 / 0.28);
  }
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  min-width: 20rem;
  background:
    radial-gradient(circle at 10% -10%, rgb(255 255 255 / .55), transparent 32rem),
    var(--background);
  color: var(--text);
  font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-optical-sizing: auto;
  text-rendering: optimizeLegibility;
}
button, input { font: inherit; }
button { color: inherit; }
button:focus-visible, input:focus-visible, a:focus-visible {
  outline: .2rem solid color-mix(in srgb, var(--accent) 55%, transparent);
  outline-offset: .18rem;
}
.skip-link {
  position: fixed;
  left: 1rem;
  top: 1rem;
  z-index: 20;
  transform: translateY(-200%);
  border-radius: .65rem;
  background: var(--surface-strong);
  padding: .7rem 1rem;
  color: var(--text);
  font-weight: 650;
  transition: transform 160ms var(--ease-out);
}
.skip-link:focus { transform: translateY(0); }

.topbar {
  position: sticky;
  top: 0;
  z-index: 10;
  height: 4.25rem;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 0 clamp(1rem, 3vw, 2.5rem);
  background: color-mix(in srgb, var(--background) 78%, transparent);
  backdrop-filter: blur(1.25rem) saturate(145%);
  -webkit-backdrop-filter: blur(1.25rem) saturate(145%);
  box-shadow: 0 .7rem 1.7rem rgb(44 57 55 / .035);
}
.brand {
  justify-self: start;
  font-size: .9rem;
  font-weight: 760;
  letter-spacing: -.02em;
}
.brand span {
  margin-left: .35rem;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}
.topbar p {
  margin: 0;
  color: var(--text-muted);
  font-size: .76rem;
  font-weight: 560;
}
.reset-button {
  justify-self: end;
  border: 0;
  border-radius: .65rem;
  background: transparent;
  padding: .6rem .72rem;
  color: var(--text-muted);
  font-size: .76rem;
  font-weight: 650;
  cursor: pointer;
  transition: color 160ms ease, background-color 160ms ease, transform 120ms var(--ease-out);
}
.reset-button:disabled { opacity: .38; cursor: default; }
.reset-button:active:not(:disabled) { transform: scale(.97); }

.product-intro {
  width: min(100% - 2rem, 96rem);
  margin: 0 auto;
  padding: clamp(1.7rem, 3.5vw, 3rem) 0 clamp(1.4rem, 2.4vw, 2rem);
}
.product-intro h1 {
  max-width: 14ch;
  margin: 0;
  font-size: clamp(2.25rem, 4.25vw, 4.35rem);
  font-weight: 680;
  line-height: .96;
  letter-spacing: -.055em;
  text-wrap: balance;
}
.product-intro p {
  max-width: 42rem;
  margin: 1.1rem 0 0;
  color: var(--text-muted);
  font-size: clamp(.92rem, 1.35vw, 1.06rem);
  line-height: 1.55;
  text-wrap: pretty;
}

.workspace {
  width: min(100% - 2rem, 96rem);
  min-height: 42rem;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 16.5rem minmax(34rem, 1fr) 18rem;
  overflow: clip;
  border: 1px solid var(--line);
  border-radius: 1.5rem;
  background: var(--surface);
  box-shadow: var(--shadow);
}
.panel { min-width: 0; }
.controls {
  border-right: 1px solid var(--line);
  padding: 1.45rem 1.1rem 1.2rem;
  max-height: 56rem;
  overflow-y: auto;
  scrollbar-width: thin;
}
.catalog {
  border-left: 1px solid var(--line);
  padding: 1.45rem 1.1rem 1.2rem;
}
.canvas {
  display: grid;
  grid-template-rows: auto auto minmax(30rem, 1fr) auto;
  padding: 1.45rem 1.6rem 1.15rem;
  overflow: hidden;
}
.section-title, .canvas-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 1rem;
}
h2 { margin: 0; font-size: .9rem; font-weight: 720; letter-spacing: -.015em; }
.section-title output {
  color: var(--text-muted);
  font-size: .8rem;
  font-variant-numeric: tabular-nums;
}
.section-title output strong { color: var(--text); font-size: 1.15rem; font-weight: 680; }
.section-title > span { color: var(--text-muted); font-size: .72rem; font-variant-numeric: tabular-nums; }

.age-control { padding-bottom: 1.15rem; }
.age-list {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: .3rem;
  margin-top: .75rem;
}
.age-list button {
  min-height: 2.45rem;
  border: 1px solid var(--line);
  border-radius: .62rem;
  background: transparent;
  padding: .35rem .22rem;
  color: var(--text-muted);
  font-size: .62rem;
  font-weight: 680;
  cursor: pointer;
}
.age-list button.active {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: var(--accent-ink);
}
.age-focus {
  margin: .65rem 0 0;
  color: var(--text-muted);
  font-size: .62rem;
  line-height: 1.38;
}
.readiness-stage {
  display: block;
  margin-top: .65rem;
  font-size: .66rem;
  line-height: 1.3;
}
.age-control .section-title { display: grid; gap: .24rem; }
.age-control .section-title > span { line-height: 1.25; }
.diameter-control { padding: 1.05rem 0 1.3rem; border-top: 1px solid var(--line); }
input[type="range"] {
  width: 100%;
  height: 1.35rem;
  margin: 1.2rem 0 .1rem;
  accent-color: var(--accent);
  cursor: ew-resize;
}
.range-labels { display: flex; justify-content: space-between; color: var(--text-muted); font-size: .68rem; font-variant-numeric: tabular-nums; }
.geometry-section, .center-section, .actions-section { border-top: 1px solid var(--line); padding-top: 1.05rem; margin-top: .1rem; }
.geometry-section, .center-section { padding-bottom: 1rem; }
.shape-list { display: grid; gap: .35rem; margin-top: .75rem; }
.shape-list button {
  min-height: 3rem;
  display: grid;
  grid-template-columns: 2.25rem 1fr;
  gap: .65rem;
  align-items: center;
  border: 1px solid transparent;
  border-radius: .72rem;
  background: transparent;
  padding: .45rem .55rem;
  text-align: left;
  cursor: pointer;
  transition: border-color 160ms ease, background-color 160ms ease, transform 120ms var(--ease-out);
}
.shape-list button.active { border-color: var(--line); background: var(--surface-strong); }
.shape-list button:active { transform: scale(.98); }
.shape-list strong, .shape-list small { display: block; }
.shape-list strong { font-size: .7rem; font-weight: 690; }
.shape-list small { margin-top: .18rem; color: var(--text-muted); font-size: .57rem; line-height: 1.15; }
.shape-icon { width: 2rem; height: 2rem; display: block; border: 2px solid var(--wall-code); background: color-mix(in srgb, var(--wall-code) 12%, transparent); }
.shape-icon-circle { border-radius: 50%; }
.shape-icon-organic { border-radius: 42% 58% 63% 37% / 47% 38% 62% 53%; transform: rotate(-8deg); }
.shape-icon-c {
  border-radius: 50%;
  -webkit-mask-image: radial-gradient(ellipse 34% 27% at 89% 50%, transparent 98%, #000 100%);
  mask-image: radial-gradient(ellipse 34% 27% at 89% 50%, transparent 98%, #000 100%);
}
.center-list { display: grid; grid-template-columns: 1fr 1fr; gap: .32rem; margin-top: .75rem; }
.center-list button {
  min-height: 3.15rem;
  display: grid;
  align-content: center;
  border: 1px solid var(--line);
  border-radius: .68rem;
  background: transparent;
  padding: .48rem;
  text-align: left;
  cursor: pointer;
  transition: border-color 160ms ease, background-color 160ms ease, color 160ms ease, transform 120ms var(--ease-out);
}
.center-list button.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-ink); }
.center-list button:active { transform: scale(.98); }
.center-list span { font-size: .64rem; font-weight: 700; line-height: 1.15; }
.center-list small { margin-top: .22rem; color: var(--text-muted); font-size: .53rem; line-height: 1.2; }
.center-list button.active small { color: currentColor; opacity: .76; }
.action-list { display: grid; gap: .24rem; margin-top: .8rem; }
.action-button {
  width: 100%;
  min-height: 2.65rem;
  display: grid;
  grid-template-columns: 1fr 1.6rem;
  align-items: center;
  border: 0;
  border-radius: .72rem;
  background: transparent;
  padding: .62rem .65rem .62rem .75rem;
  text-align: left;
  font-size: .79rem;
  font-weight: 590;
  cursor: pointer;
  transition: color 160ms ease, background-color 180ms ease, transform 120ms var(--ease-out);
}
.action-button.active { background: var(--accent-soft); color: var(--accent-ink); font-weight: 690; }
.action-button:active { transform: scale(.98); }
.action-meta {
  justify-self: end;
  min-width: 1.5rem;
  color: currentColor;
  text-align: center;
  font-size: .7rem;
  font-variant-numeric: tabular-nums;
}

.canvas-head h2 { font-size: 1rem; }
.canvas-head p { margin: .35rem 0 0; color: var(--text-muted); font-size: .75rem; font-variant-numeric: tabular-nums; }
.canvas-head-meta { display: grid; justify-items: end; gap: .65rem; }
.status {
  flex: none;
  border-radius: 999px;
  background: var(--success-soft);
  padding: .45rem .65rem;
  color: var(--success);
  font-size: .68rem;
  font-weight: 680;
}
.status.warn { background: var(--accent-soft); color: var(--accent-ink); }
.status.critical { background: #7d2c1d; color: #fff7f4; }
.capacity-strip {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: .45rem;
  margin-top: .85rem;
}
.capacity-strip > span {
  min-width: 0;
  display: grid;
  gap: .18rem;
  border: 1px solid var(--line);
  border-radius: .65rem;
  background: color-mix(in srgb, var(--surface-strong) 58%, transparent);
  padding: .55rem .6rem;
}
.capacity-strip small { color: var(--text-muted); font-size: .54rem; line-height: 1.2; }
.capacity-strip strong { font-size: .67rem; font-weight: 700; line-height: 1.2; }
.plan-legend { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: .35rem .7rem; }
.plan-legend span {
  display: inline-flex;
  align-items: center;
  gap: .3rem;
  color: var(--text-muted);
  font-size: .58rem;
  font-weight: 630;
  white-space: nowrap;
}
.plan-legend i { width: .55rem; height: .55rem; border-radius: 50%; background: currentColor; }
.legend-floor { color: var(--floor-code) !important; }
.legend-wall { color: var(--wall-code) !important; }
.legend-mobile { color: var(--mobile-code) !important; }
.layer-toolbar {
  display: flex;
  align-items: center;
  gap: .32rem;
  margin-top: .85rem;
  overflow-x: auto;
  scrollbar-width: none;
}
.layer-toolbar > span { margin-right: .15rem; color: var(--text-muted); font-size: .6rem; white-space: nowrap; }
.layer-toolbar button {
  flex: none;
  border: 1px solid var(--line);
  border-radius: .48rem;
  background: transparent;
  padding: .36rem .5rem;
  color: var(--text-muted);
  font-size: .58rem;
  font-weight: 660;
  cursor: pointer;
  transition: border-color 150ms ease, background-color 150ms ease, color 150ms ease, transform 120ms var(--ease-out);
}
.layer-toolbar button.active { border-color: var(--line-strong); background: var(--surface-muted); color: var(--text); }
.layer-toolbar button:active { transform: scale(.97); }
.interaction-help {
  margin: .55rem 0 0;
  color: var(--text-muted);
  font-size: .59rem;
  line-height: 1.35;
}
.island-wrap { min-height: 31rem; display: grid; place-items: center; position: relative; }
.island-stage { width: min(88%, 32rem); aspect-ratio: 1; display: grid; place-items: center; }
.island {
  width: 100%;
  aspect-ratio: 1;
  position: relative;
  border: 1px solid var(--line-strong);
  border-radius: 50%;
  background:
    radial-gradient(circle at 34% 24%, rgb(255 255 255 / .7), transparent 32%),
    var(--surface-muted);
  box-shadow: inset 0 0 0 .8rem rgb(255 255 255 / .18), 0 1.4rem 3rem rgb(38 51 49 / .13);
  transform: scale(var(--island-scale));
  transition: transform 260ms var(--ease-in-out);
}
.island-organic { border-radius: 43% 57% 61% 39% / 46% 38% 62% 54%; }
.island-c {
  border: 0;
  border-radius: 0;
  background: transparent;
  box-shadow: none;
}
.island-c::before {
  content: "";
  position: absolute;
  inset: 0;
  border: 1px solid var(--line-strong);
  border-radius: 50%;
  -webkit-mask-image: radial-gradient(ellipse 34% 27% at 89% 50%, transparent 98%, #000 100%);
  mask-image: radial-gradient(ellipse 34% 27% at 89% 50%, transparent 98%, #000 100%);
  background:
    radial-gradient(circle at 30% 24%, rgb(255 255 255 / .7), transparent 32%),
    var(--surface-muted);
  box-shadow: inset 0 0 0 .8rem rgb(255 255 255 / .18), 0 1.4rem 3rem rgb(38 51 49 / .13);
}
.island-grid {
  position: absolute;
  inset: 9%;
  border-radius: 50%;
  background-image:
    linear-gradient(rgb(85 102 99 / .07) 1px, transparent 1px),
    linear-gradient(90deg, rgb(85 102 99 / .07) 1px, transparent 1px);
  background-size: 2.2rem 2.2rem;
  mask-image: radial-gradient(circle, #000 66%, transparent 68%);
}
.island-organic .island-grid { border-radius: 43% 57% 61% 39% / 46% 38% 62% 54%; }
.island-c .island-grid {
  inset: 5%;
  border-radius: 50%;
  -webkit-mask-image: radial-gradient(ellipse 34% 27% at 89% 50%, transparent 98%, #000 100%);
  mask-image: radial-gradient(ellipse 34% 27% at 89% 50%, transparent 98%, #000 100%);
}
.perimeter-ring {
  position: absolute;
  inset: 3.7%;
  border: .26rem solid color-mix(in srgb, var(--wall-code) 38%, transparent);
  border-radius: 50%;
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--surface-strong) 65%, transparent);
  pointer-events: none;
}
.island-organic .perimeter-ring { border-radius: 43% 57% 61% 39% / 46% 38% 62% 54%; }
.island-c .perimeter-ring {
  inset: 3%;
  border: .26rem solid color-mix(in srgb, var(--wall-code) 38%, transparent);
  border-radius: 50%;
  -webkit-mask-image: radial-gradient(ellipse 34% 27% at 89% 50%, transparent 98%, #000 100%);
  mask-image: radial-gradient(ellipse 34% 27% at 89% 50%, transparent 98%, #000 100%);
  box-shadow: inset 0 0 0 .3rem color-mix(in srgb, var(--wall-code) 45%, transparent);
}
.measure {
  position: absolute;
  z-index: 2;
  color: var(--text-muted);
  font-size: .67rem;
  font-variant-numeric: tabular-nums;
}
.measure-top { top: 1.45rem; left: 50%; transform: translateX(-50%); }
.center-note {
  position: absolute;
  left: 50%;
  top: 50%;
  z-index: 2;
  width: 5.8rem;
  height: 5.8rem;
  display: grid;
  place-content: center;
  border: 1px solid rgb(255 255 255 / .5);
  border-radius: 50%;
  background: color-mix(in srgb, var(--surface-strong) 82%, transparent);
  backdrop-filter: blur(.8rem);
  -webkit-backdrop-filter: blur(.8rem);
  box-shadow: 0 .55rem 1.4rem rgb(38 51 49 / .1);
  text-align: center;
  transform: translate(-50%, -50%);
}
.center-note strong { font-size: 1.55rem; font-weight: 650; line-height: 1; font-variant-numeric: tabular-nums; }
.center-note span { max-width: 4.2rem; margin-top: .28rem; color: var(--text-muted); font-size: .55rem; line-height: 1.15; }
.effect-link {
  position: absolute;
  z-index: 2;
  height: 0;
  border-top: 1px dashed color-mix(in srgb, var(--accent) 72%, transparent);
  transform-origin: left center;
  pointer-events: none;
  animation: link-flow 1.8s linear infinite;
}
.effect-link::after {
  content: "";
  position: absolute;
  right: -.15rem;
  top: -.18rem;
  width: .32rem;
  height: .32rem;
  border-radius: 50%;
  background: var(--accent);
}
@keyframes link-flow { 50% { opacity: .42; } }
.center-module {
  position: absolute;
  top: 50%;
  z-index: 4;
  width: 7.2rem;
  display: grid;
  justify-items: center;
  text-align: center;
  pointer-events: none;
  transform: translate(-50%, -50%);
  transition: opacity 180ms ease, filter 180ms ease;
}
.center-visual {
  position: relative;
  width: 4.8rem;
  height: 4.8rem;
  display: block;
  border: 2px solid color-mix(in srgb, var(--accent) 42%, var(--line));
  background: color-mix(in srgb, var(--surface-strong) 74%, transparent);
  box-shadow: 0 .5rem 1.4rem rgb(38 51 49 / .12);
}
.center-module > strong {
  margin-top: .42rem;
  border-radius: .38rem;
  background: color-mix(in srgb, var(--surface-strong) 90%, transparent);
  padding: .2rem .35rem;
  font-size: .58rem;
  font-weight: 740;
  line-height: 1.1;
}
.center-module > small { max-width: 7rem; margin-top: .18rem; color: var(--text-muted); font-size: .49rem; line-height: 1.15; }
.center-free .center-visual { border-style: dashed; border-radius: 50%; background: color-mix(in srgb, var(--surface-strong) 32%, transparent); box-shadow: none; }
.center-free .center-visual::after { content: ""; position: absolute; inset: 28%; border: 1px dotted var(--line-strong); border-radius: 50%; }
.center-relief .center-visual { width: 6.6rem; height: 5.2rem; border-radius: 44% 56% 38% 62% / 58% 42% 58% 42%; background: linear-gradient(145deg, #f1c46f, #d99267 54%, #8db58e); }
.center-relief .center-visual i { position: absolute; display: block; border-radius: 50%; background: rgb(255 255 255 / .38); box-shadow: inset -.2rem -.25rem .4rem rgb(87 67 48 / .16); }
.center-relief .center-visual i:nth-child(1) { width: 2rem; height: 2rem; left: .7rem; top: .6rem; }
.center-relief .center-visual i:nth-child(2) { width: 2.8rem; height: 2.8rem; right: .5rem; bottom: .35rem; }
.center-relief .center-visual i:nth-child(3) { width: 1.4rem; height: 1.4rem; left: 2.6rem; bottom: .45rem; }
.center-nest .center-visual { width: 5.8rem; height: 4.8rem; border-radius: 50%; background: #c88975; box-shadow: inset 0 0 0 .75rem #9b6658, inset 0 0 0 1.08rem rgb(255 255 255 / .3), 0 .5rem 1.4rem rgb(38 51 49 / .12); }
.center-support .center-visual { width: 3.3rem; height: 3.3rem; border-radius: 50%; background: radial-gradient(circle at 35% 28%, #a9c2b0, #688876 62%, #4b6558); box-shadow: 0 0 0 .55rem rgb(255 255 255 / .3), 0 0 0 .68rem color-mix(in srgb, var(--mobile-code) 52%, transparent), 0 .55rem 1.4rem rgb(38 51 49 / .2); }
.center-support .center-visual::after { content: ""; position: absolute; inset: 42%; border-radius: 50%; background: white; }
.center-effect .center-visual { width: 4.1rem; height: 5.3rem; border-radius: 42% 42% 22% 22%; background: linear-gradient(90deg, #7ebbd2, #d6edf0 47%, #6e9ed0); box-shadow: inset .45rem 0 .7rem rgb(255 255 255 / .42), 0 .6rem 1.5rem rgb(38 51 49 / .18); }
.center-effect .center-visual i { position: absolute; display: block; border-radius: 50%; background: #f08d61; animation: center-bubble 2.2s var(--ease-in-out) infinite alternate; }
.center-effect .center-visual i:nth-child(1) { width: .65rem; height: .65rem; left: .65rem; bottom: .55rem; }
.center-effect .center-visual i:nth-child(2) { width: .9rem; height: .9rem; right: .65rem; bottom: 1rem; animation-delay: -.7s; }
.center-effect .center-visual i:nth-child(3) { width: .52rem; height: .52rem; left: 1.8rem; bottom: 1.8rem; animation-delay: -1.1s; }
@keyframes center-bubble { to { transform: translateY(-2.7rem); } }
.layer-hidden { opacity: .07 !important; filter: grayscale(1); pointer-events: none !important; }
.empty-state {
  position: absolute;
  left: 50%;
  top: 67%;
  width: 13rem;
  display: grid;
  gap: .3rem;
  text-align: center;
  transform: translateX(-50%);
}

@media (max-width: 72rem) {

}

}

@media (prefers-contrast: more) {
  :root { --line: var(--line-strong); }
  .topbar, .center-note { background: var(--surface-strong); }
}
